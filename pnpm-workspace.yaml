allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.18

# Fuerza versiones parcheadas de dependencias transitivas vulnerables
# (reportadas por Dependabot/pnpm audit), sin subir de major las
# dependencias directas que las arrastran. La línea 1.x de
# brace-expansion se queda en su último parche porque minimatch@3.x
# (usado por eslint) rompe si se fuerza la mayor 5.x.
overrides:
  fast-uri@<3.1.6: ^3.1.6
  postcss@<8.5.23: ^8.5.23
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <5.0.9: ^5.0.9
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.18: ^3.3.18
  colord@<2.9.4: ^2.9.4
